<style>

<div id="tb"><div class="t" id="tb-t">DW-F · Low-tunnel module</div><div>Water</div><div id="tb-a"></div><div>Materials</div><div id="tb-m"></div><div>Units</div><div>feet · to scale</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.78;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 5000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5b5a3c, 0.35));
const sun = new THREE.DirectionalLight(0xfff3df, 1.5);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
let root = new THREE.Group(); scene.add(root);

// ---------- textures ----------
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lemnaTex = () => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#3f7a24"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const x = rnd() * w, y = rnd() * h, r = 2 + rnd() * 4;
    g.fillStyle = `hsl(${88 + rnd() * 22},${45 + rnd() * 25}%,${22 + rnd() * 20}%)`; g.beginPath(); g.ellipse(x, y, r, r * 0.7, rnd() * 3, 0, 7); g.fill(); }
}, [6, 6]);
const grassTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#6b8547"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `hsl(${75 + rnd() * 25},${30 + rnd() * 20}%,${30 + rnd() * 18}%)`; g.fillRect(rnd() * w, rnd() * h, 1.5, 3); } }, [80, 80]);
const gravelTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#a59d8f"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `hsl(35,${5 + rnd() * 10}%,${45 + rnd() * 30}%)`; g.fillRect(rnd() * w, rnd() * h, 2, 2); } }, [10, 10]);
const woodTex = (base, grey) => canvasTex(256, 64, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { g.strokeStyle = grey ? `rgba(40,40,40,${0.1 + rnd() * 0.2})` : `rgba(90,60,20,${0.1 + rnd() * 0.25})`; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rnd() * 6 - 3, w * .6, y + rnd() * 6 - 3, w, y); g.stroke(); } }, [6, 1]);
const corrTex = (col) => canvasTex(64, 8, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, col); gr.addColorStop(0.5, "#ffffff22"); gr.addColorStop(1, col); g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, 0, 6, h); g.fillRect(32, 0, 6, h); }, [40, 1]);
const netTex = canvasTex(128, 128, (g, w, h) => { g.clearRect(0, 0, w, h); g.strokeStyle = "rgba(20,20,20,1)"; g.lineWidth = 4;
  for (let i = 0; i <= w; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } }, [20, 20]);
const billboardTex = canvasTex(512, 256, (g, w, h) => { const cols = ["#f1f1ec", "#1b1b1b", "#d8d4c8", "#f1f1ec", "#23262a"];
  for (let i = 0; i < 6; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(i * w / 6, 0, w / 6 + 2, h); }
  g.fillStyle = "#c0392b"; g.fillRect(w * 0.18, h * 0.1, w * 0.05, h * 0.25); g.fillStyle = "#e8b923"; g.fillRect(w * 0.7, h * 0.6, w * 0.08, h * 0.2);
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 3; for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(i * w / 6, 0); g.lineTo(i * w / 6, h); g.stroke(); } }, [1, 1]);

// ---------- material + geometry helpers ----------
const M = {
  lemna: () => new THREE.MeshStandardMaterial({ map: lemnaTex(), roughness: 0.75 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x3b5d4c, roughness: 0.08, metalness: 0, transmission: 0, clearcoat: 1 }),
  liner: new THREE.MeshStandardMaterial({ color: 0x22262a, roughness: 0.55 }),
  billboard: new THREE.MeshStandardMaterial({ map: billboardTex, roughness: 0.6 }),
  pt: new THREE.MeshStandardMaterial({ map: woodTex("#9a8a5e"), roughness: 0.85 }),
  barn: new THREE.MeshStandardMaterial({ map: woodTex("#8c8a84", true), roughness: 0.95 }),
  film: new THREE.MeshPhysicalMaterial({ color: 0xf4f8f6, roughness: 0.2, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  oldfilm: new THREE.MeshPhysicalMaterial({ color: 0xe9e6d6, roughness: 0.5, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false }),
  shade: new THREE.MeshStandardMaterial({ color: 0x2a2f2c, roughness: 0.9, transparent: true, opacity: 0.7, side: THREE.DoubleSide }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb8bec2, roughness: 0.35, metalness: 0.8 }),
  pvc: new THREE.MeshStandardMaterial({ color: 0xf0f0ea, roughness: 0.5 }),
  pvcGrey: new THREE.MeshStandardMaterial({ color: 0x8e979b, roughness: 0.5 }),
  ibc: new THREE.MeshPhysicalMaterial({ color: 0xf2f2ea, roughness: 0.4, transparent: true, opacity: 0.85 }),
  drum: new THREE.MeshStandardMaterial({ color: 0x2f5fa7, roughness: 0.5 }),
  poly: new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.6 }),
  tan: new THREE.MeshStandardMaterial({ color: 0x9b7647, roughness: 0.6 }),
  purple: new THREE.MeshStandardMaterial({ color: 0x7a58ad, roughness: 0.6 }),
  green: new THREE.MeshStandardMaterial({ color: 0x2f8a35, roughness: 0.6 }),
  orange: new THREE.MeshStandardMaterial({ color: 0xe07b25, roughness: 0.6 }),
  dirt: new THREE.MeshStandardMaterial({ color: 0x7a6248, roughness: 1 }),
  sludge: new THREE.MeshStandardMaterial({ color: 0x4a3c22, roughness: 0.95, envMapIntensity: 0.2 }),
  concrete: new THREE.MeshStandardMaterial({ color: 0xb9b6ae, roughness: 0.9 }),
  gravel: new THREE.MeshStandardMaterial({ map: gravelTex, roughness: 1 }),
  net: new THREE.MeshStandardMaterial({ map: netTex, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 1 }),
  red: new THREE.MeshStandardMaterial({ color: 0xb03a2e, roughness: 0.5 }),
  black: new THREE.MeshStandardMaterial({ color: 0x1d1f20, roughness: 0.6 }),
  mesh: new THREE.MeshStandardMaterial({ color: 0x9aa3a6, roughness: 0.4, metalness: 0.7, transparent: true, opacity: 0.8 }),
};
function add(mesh, parent = root) { mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; }
// box by min-corner-free center coords: x along length, y up, z across
function box(w, h, d, mat, x, y, z, parent) { const m = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat), parent); m.position.set(x, y, z); return m; }
function cyl(r, h, mat, x, y, z, axis = "y", parent, seg = 24) {
  const m = add(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat), parent); m.position.set(x, y, z);
  if (axis === "x") m.rotation.z = Math.PI / 2; if (axis === "z") m.rotation.x = Math.PI / 2; return m; }
function tube(points, r, mat, parent) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, "catmullrom", 0.05);
  return add(new THREE.Mesh(new THREE.TubeGeometry(curve, points.length * 16, r, 10, false), mat), parent); }
function plane(w, d, mat, x, y, z, parent) { const m = add(new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat), parent); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); return m; }
function ground(size = 900, mat) { const g = plane(size, size, mat || new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }), 0, -0.02, 0); g.castShadow = false; g.userData.skip = true; return g; }
// half-tunnel along x: width w (z), height h, length L, centered x0,z0
function tunnelShell(L, w, h, mat, x0, y0, z0, parent, open = 1) {
  const g = new THREE.CylinderGeometry(1, 1, L, 40, 1, true, Math.PI * (1 - open) / 2 + Math.PI / 2, Math.PI * open);
  const m = add(new THREE.Mesh(g, mat), parent); m.rotation.z = Math.PI / 2; m.scale.set(h, 1, w / 2); m.position.set(x0, y0, z0);
  m.rotation.order = "ZYX"; return m; }
function hoop(w, h, mat, x, y0, z0, r = 0.05, parent) {
  const pts = []; for (let i = 0; i <= 24; i++) { const a = Math.PI * i / 24; pts.push([x, y0 + Math.sin(a) * h, z0 - Math.cos(a) * w / 2]); }
  return tube(pts, r, mat, parent); }

// ---------- callouts ----------
let callouts = [];
function label(n, text, pos, re = false) { callouts.push({ n, text, pos: new THREE.Vector3(...pos), re }); }

// ---------- LANE MODULE (LT / OL / H30 interior / reclaimed) ----------
// pad 96 x 30 ft. Lanes 4 x 6.5 ft wide, 88 ft long, x from -44..44
function laneModule(opt = {}, parent = root, ox = 0, oz = 0) {
  const G = new THREE.Group(); G.position.set(ox, 0, oz); parent.add(G);
  const re = !!opt.reclaimed;
  const L = 88, lw = 6.5, wallH = 0.94, waterY = 0.67, t = 0.13;
  const z0 = -(4 * lw) / 2;
  box(96, 0.15, 30, opt.pad || M.gravel, 0, 0.0, 0, G).castShadow = false;
  // liner sheet
  const linerMat = re ? M.billboard : M.liner;
  const liner = box(L + 1, 0.05, 4 * lw + 0.6, linerMat, 0, 0.1, 0, G);
  if (re) { liner.material = M.billboard.clone(); liner.material.map = billboardTex.clone(); liner.material.map.needsUpdate = true; liner.material.map.repeat.set(4, 1); }
  const wallMat = re ? M.barn : M.pt;
  for (let i = 0; i <= 4; i++) {
    const z = z0 + i * lw;
    box(L, wallH, t, wallMat, 0, wallH / 2 + 0.1, z, G);
    box(L, 0.04, t + 0.08, linerMat === M.billboard ? M.black : M.liner, 0, wallH + 0.12, z, G); // liner lip
  }
  // end walls with serpentine gaps (U-turns alternate)
  for (let i = 0; i < 4; i++) {
    const zc = z0 + (i + 0.5) * lw;
    const openEast = i % 2 === 0, openWest = i % 2 === 1;
    if (!(openEast && i < 3)) box(t, wallH, lw, wallMat, L / 2, wallH / 2 + 0.1, zc, G);
    if (!(openWest && i < 3) && i !== 0) box(t, wallH, lw, wallMat, -L / 2, wallH / 2 + 0.1, zc, G);
    if (i === 0) box(t, wallH, lw, wallMat, -L / 2, wallH / 2 + 0.1, zc, G);
  }
  // U-turn bays (small water boxes outside ends)
  for (let i = 0; i < 3; i++) {
    const east = i % 2 === 0, x = east ? L / 2 + 1.6 : -L / 2 - 1.6, zc = z0 + (i + 1) * lw;
    box(3.2, wallH, t, wallMat, x, wallH / 2 + 0.1, zc - lw, G); box(3.2, wallH, t, wallMat, x, wallH / 2 + 0.1, zc + lw, G);
    box(t, wallH, 2 * lw, wallMat, east ? L / 2 + 3.2 : -L / 2 - 3.2, wallH / 2 + 0.1, zc, G);
    plane(3.2, 2 * lw - t, M.water, x, waterY, zc, G);
  }
  // water + duckweed per lane, with harvested patch near outlet on lane 2
  const lem = M.lemna();
  for (let i = 0; i < 4; i++) {
    const zc = z0 + (i + 0.5) * lw;
    plane(L - t, lw - t, M.water, 0, waterY - 0.01, zc, G);
    if (i === 1) { plane(L * 0.62, lw - t, lem, -L * 0.19, waterY, zc, G); plane(L * 0.38 - 2, lw - t, lem, L * 0.31 + 1, waterY, zc, G).material = new THREE.MeshStandardMaterial({ map: lem.map, color: 0xb9d79a, transparent: true, opacity: 0.45 }); }
    else plane(L - t, lw - t, lem, 0, waterY, zc, G);
    // floating barriers every ~15 ft
    for (let x = -L / 2 + 15; x < L / 2 - 5; x += 15) {
      if (re && i % 2) { for (let k = 0; k < 5; k++) cyl(0.18, 0.5, M.pvc, x, waterY + 0.08, zc - lw / 2 + 0.8 + k * 1.2, "z", G, 12); }
      else cyl(0.065, lw - 0.3, M.pvc, x, waterY + 0.05, zc, "z", G, 10);
    }
  }
  // push boom on lane 2
  cyl(0.09, lw - 0.4, re ? M.orange : M.pvc, L * 0.12, waterY + 0.07, z0 + 1.5 * lw, "z", G, 12);
  tube([[L * 0.12, waterY + 0.1, z0 + 1.5 * lw], [L / 2 - 2, waterY + 0.4, z0 + 1.5 * lw], [L / 2 + 2, 1.6, z0 + 1.5 * lw]], 0.025, M.black, G);
  // inlet box (lane 1 west) and outlet weir box (lane 4 east)
  const boxMat = re ? M.ibc : M.pvcGrey;
  const inX = -L / 2 - 2.2, inZ = z0 + 0.5 * lw;
  box(3, 2.2, 3, boxMat, inX, 1.1, inZ, G);
  if (re) for (let k = -1; k <= 1; k++) { box(3.05, 0.06, 0.06, M.steel, inX, 0.2 + (k + 1) * 0.95, inZ - 1.52, G); box(0.06, 2.2, 0.06, M.steel, inX + k * 1.5, 1.1, inZ - 1.52, G); }
  const outX = L / 2 + 2.2, outZ = z0 + 3.5 * lw;
  box(3, 2.2, 3, boxMat, outX, 1.1, outZ, G);
  cyl(0.2, 1.7, M.pvc, outX, 1.2, outZ, "y", G);
  if (re) for (let k = -1; k <= 1; k++) { box(3.05, 0.06, 0.06, M.steel, outX, 0.2 + (k + 1) * 0.95, outZ + 1.52, G); box(0.06, 2.2, 0.06, M.steel, outX + k * 1.5, 1.1, outZ + 1.52, G); }
  tube([[inX - 1.5, 1.4, inZ], [inX - 6, 1.4, inZ], [inX - 9, 0.4, inZ]], 0.2, M.tan, G);
  tube([[outX + 1.5, 0.6, outZ], [outX + 6, 0.6, outZ], [outX + 9, 0.3, outZ]], 0.2, M.purple, G);
  // harvest troughs at lane ends (east end of lanes 1 & 3 under U-turns, so put at west end of lanes 2/4 and east of 4)
  for (const i of [1, 3]) {
    const zc = z0 + (i + 0.5) * lw, x = L / 2 + 0.9;
    if (i === 3) continue;
    if (re) { const d = cyl(1.0, lw - 0.6, M.drum, x, 0.75, zc, "z", G); d.scale.set(1, 1, 1); }
    else box(1.4, 0.7, lw - 0.6, M.steel, x, 0.6, zc, G);
  }
  return { G, L, lw, z0, waterY, inlet: [inX, 2.2, inZ], outlet: [outX, 2.2, outZ] };
}
function lowTunnels(mod, opt = {}) {
  const { G, L, lw, z0 } = mod; const film = opt.reclaimed ? M.oldfilm : M.film;
  for (let i = 0; i < 4; i++) {
    const zc = z0 + (i + 0.5) * lw;
    const rolled = i === 1, shade = i === 3;
    for (let x = -L / 2 + 1; x <= L / 2 - 1; x += 5) hoop(lw - 0.3, 3, M.steel, x, 0.96, zc, 0.045, G);
    if (rolled) { cyl(0.18, L - 2, film, 0, 1.1, zc - lw / 2 + 0.35, "x", G); continue; }
    tunnelShell(L - 2, lw - 0.3, 3, shade ? M.shade : film, 0, 0.96, zc, G);
    tube([[-L / 2 + 1, 3.98, zc], [L / 2 - 1, 3.98, zc]], 0.03, M.black, G);
  }
}

      label(1, "Farm storage (winter flow held here)", [-150, 1, -20]); label(2, "Headworks: screen, IBC settling, blend box", [hx + 4, 7.5, -10]);
      label(3, "Train A: 4 LT modules in series", [-10, 4, -66]); label(4, "Train B: 4 LT modules", [105, 4, -66]); label(5, "Dewatering + solar dryer", [180, 9, -40]);
      label(6, "Shed: winter inoculum bank (IBC halves + LEDs)", [-80, 11, 50]); label(7, "Treated water back to storage / irrigation", [40, 0.8, 95]); } },
};

// ---------- view switching ----------
const ORDER = ["SITE", "LT", "LTR", "H30", "OL", "P1000", "C40", "HEAD", "DEW"];
const vEl = document.getElementById("views");
ORDER.forEach(k => { const b = document.createElement("button"); b.type = "button"; b.textContent = VIEWS[k].name; b.dataset.k = k; b.onclick = () => setView(k); vEl.appendChild(b); });
const coEl = document.getElementById("callouts"), ldEl = document.getElementById("leaders");
function setView(k) {
  scene.remove(root); root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); root = new THREE.Group(); scene.add(root); callouts = []; seed = 7;
  const v = VIEWS[k]; v.build();
  document.getElementById("title").textContent = v.title; document.getElementById("lede").textContent = v.lede;
  document.getElementById("tb-t").textContent = "DW-F · " + v.title; document.getElementById("tb-a").textContent = v.area; document.getElementById("tb-m").textContent = v.mat;
  vEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  // fit: keep the view direction from v.cam, frame the model's bounding sphere
  const bb = new THREE.Box3(); root.traverse(o => { if (o.isMesh && !o.userData.skip) bb.expandByObject(o); });
  const sph = bb.getBoundingSphere(new THREE.Sphere()); const tgt = sph.center;
  const dir = new THREE.Vector3(...v.cam).sub(new THREE.Vector3(...v.tgt)).normalize();
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect * 0.78);
  const dist = sph.radius / Math.sin(Math.min(vf, hf)) * (v.zoom || 0.6);
  camera.position.copy(tgt).addScaledVector(dir, dist); controls.target.copy(tgt); controls.update();
  const span = dist; sun.position.set(tgt.x - span * 0.5, span * 1.1, tgt.z - span * 0.35); sun.target.position.copy(tgt);
  const sc = sun.shadow.camera, ext = Math.max(60, span * 0.9); sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 1; sc.far = span * 4; sc.updateProjectionMatrix();
  scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--scene").trim() || "#dfe4dc");
  coEl.innerHTML = callouts.map(c => `<div class="co${c.re ? " re" : ""}"><b>${c.n}</b>${c.text}</div>`).join("");
  document.getElementById("legend").innerHTML = callouts.map(c => `<li class="${c.re ? "re" : ""}"><b>${c.n}</b><span>${c.text}${c.re ? " · reclaimed" : ""}</span></li>`).join("");
  try { history.replaceState(null, "", "#" + k.toLowerCase()); } catch (e) {}
  window.__view = k;
}
function placeCallouts() {
  const w = canvas.clientWidth, h = canvas.clientHeight; const els = coEl.children; let lines = "";
  const placed = [];
  callouts.forEach((c, i) => { const p = c.pos.clone().project(camera); const el = els[i]; if (!el) return;
    const x = (p.x + 1) / 2 * w, y = (1 - p.y) / 2 * h; const ew = el.offsetWidth, eh = el.offsetHeight;
    let lx = x + 24, ly = y - 46; if (lx + ew > w - 12) lx = x - 24 - ew;
    for (let t = 0; t < 12; t++) { if (!placed.some(q => Math.abs(q[0] - lx) < (ew + q[2]) / 2 + 6 && Math.abs(q[1] - ly) < eh + 4)) break; ly -= eh + 6; }
    placed.push([lx + ew / 2, ly, ew]);
    el.style.transform = `translate(${lx}px, ${ly - eh / 2}px)`; el.style.display = p.z < 1 ? "flex" : "none";
    const ax = lx < x ? lx + ew : lx;
    lines += `<line x1="${x}" y1="${y}" x2="${ax}" y2="${ly}" stroke="currentColor" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="3" fill="currentColor"/>`; });
  ldEl.innerHTML = lines; ldEl.style.color = getComputedStyle(document.documentElement).getPropertyValue("--ink");
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  if (w > 700) camera.setViewOffset(w, h, -w * 0.11, 0, w, h); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();
let running = true;
function renderOnce() { controls.update(); renderer.render(scene, camera); placeCallouts(); }
function loop() { if (!running) return; renderOnce(); requestAnimationFrame(loop); }
window.renderOnce = renderOnce; window.stopLoop = () => { running = false; };
const start = (location.hash || "").slice(1).toUpperCase();
setView(VIEWS[start] ? start : "SITE"); loop();
window.setView = setView; window.__ready = true;
</script>
